name = "rag-lab-billing"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV 命名空间: 存订阅状态 + 配额 + 邮箱验证码
# 创建命令 (wrangler 4.x 新语法, 注意是空格不是冒号):
#   npx wrangler kv namespace create SUB
[[kv_namespaces]]
binding = "SUB"
id = "759ef00019f244cfa1776bb28bcecd43"

# 环境变量 (Stripe 密钥, 不要 commit 真 key)
# 用 wrangler secret put 设, 不会写进 git:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put PRICE_ID_PRO
#
# 注意: 不要定义 [env.production] (production 是 wrangler 保留名, 会警告)
# 本项目只有 top-level 一套配置, 直接 wrangler deploy 即可
# 如需 staging: 自己加 [env.staging] 并用 wrangler deploy --env staging